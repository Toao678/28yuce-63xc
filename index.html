<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC28 · 四组合排除法实时预测</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  /* ============================================================
     明亮主题
     ============================================================ */
  :root{
    --bg-0:#f8fafc;
    --bg-1:#eef2f9;
    --bg-2:#e6edf7;
    --glass:rgba(255,255,255,0.82);
    --glass-strong:rgba(255,255,255,0.94);
    --glass-line:rgba(150,170,200,0.28);
    --glass-line-2:rgba(100,130,180,0.42);
    --txt:#1a202c;
    --txt-2:#2d3748;
    --sub:#5f7291;
    --accent:#2b7cf5;
    --accent-2:#6366f1;
    --accent-3:#0891b2;
    --good:#10a37f;
    --bad:#e11d48;
    --warn:#d97706;
    --purple:#7c3aed;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13.5px; line-height:1.5;
    background:
      radial-gradient(1200px 800px at 10% -10%, rgba(43,124,245,0.10), transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, rgba(99,102,241,0.09), transparent 60%),
      radial-gradient(900px 600px at 50% 120%, rgba(8,145,178,0.07), transparent 60%),
      linear-gradient(180deg, #fbfcfe 0%, var(--bg-1) 45%, var(--bg-2) 100%);
    background-attachment:fixed;
    overflow-x:hidden;
  }
  body::before, body::after{
    content:""; position:fixed; pointer-events:none; z-index:0;
    width:55vmax; height:55vmax; border-radius:50%;
    filter:blur(100px); opacity:.22;
    animation:float 22s ease-in-out infinite;
  }
  body::before{
    background:radial-gradient(circle, #a7c8ff 0%, transparent 65%);
    top:-22vmax; left:-15vmax;
  }
  body::after{
    background:radial-gradient(circle, #c5c8ff 0%, transparent 65%);
    bottom:-25vmax; right:-15vmax; animation-delay:-11s;
  }
  @keyframes float{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(4vmax,3vmax,0) scale(1.08)}
  }
  .grid-overlay{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(100,140,200,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(100,140,200,0.06) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 30%, #000 30%, transparent 88%);
    -webkit-mask-image:radial-gradient(circle at 50% 30%, #000 30%, transparent 88%);
  }
  .wrap{
    position:relative; z-index:1;
    max-width:1200px; margin:0 auto; padding:14px 12px 40px;
  }

  /* 标题 */
  .hero{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; margin-bottom:12px;
  }
  .hero h1{
    font-size:clamp(16px, 2.2vw, 20px);
    margin:0 0 2px; letter-spacing:.2px;
    background:linear-gradient(90deg, #1a202c 0%, #2b7cf5 50%, #6366f1 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-weight:800;
  }
  .hero .sub{color:var(--sub); font-size:11.5px}
  .live-badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px; border-radius:16px; font-size:11.5px;
    background:rgba(16,163,127,.12); border:1px solid rgba(16,163,127,.35);
    color:var(--good); font-weight:600;
  }
  .live-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--good); box-shadow:0 0 8px var(--good);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1)}
    50%{opacity:.5; transform:scale(.85)}
  }
  .mem-badge{
    display:inline-flex; align-items:center; gap:5px;
    padding:4px 10px; border-radius:16px; font-size:11.5px;
    background:rgba(43,124,245,.10); border:1px solid rgba(43,124,245,.32);
    color:var(--accent); font-weight:600;
  }
  .mem-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 7px var(--accent);
  }

  /* 卡片 */
  .card{
    position:relative;
    background:var(--glass);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border:1px solid var(--glass-line);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.7) inset,
      0 8px 24px -16px rgba(20,40,80,0.25);
  }
  .card h2{
    font-size:11.5px; margin:0 0 10px; color:var(--accent);
    font-weight:700; letter-spacing:1px; text-transform:uppercase;
    display:flex; align-items:center; gap:6px;
  }
  .card h2::before{
    content:""; width:3px; height:11px; border-radius:2px;
    background:linear-gradient(180deg, var(--accent), var(--accent-2));
  }

  .grid{display:grid; gap:8px}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:900px){ .g4{grid-template-columns:1fr 1fr} }
  @media(max-width:560px){ .g4{grid-template-columns:1fr 1fr} }

  button{
    position:relative; z-index:2;
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color:#fff; border:none;
    padding:8px 16px; border-radius:8px; font-size:12.5px;
    font-weight:600; cursor:pointer; letter-spacing:.3px;
    box-shadow:0 6px 16px -8px var(--accent);
    transition: filter .15s ease, transform .15s ease;
  }
  button:hover{filter:brightness(1.06); transform:translateY(-1px)}

  /* 提示 */
  .alert{
    display:flex; align-items:center; gap:8px;
    padding:8px 12px; border-radius:9px; font-size:12px;
    margin-bottom:10px;
  }
  .alert-ok{background:rgba(16,163,127,.10); border:1px solid rgba(16,163,127,.32); color:#0b7f63}
  .alert-warn{background:rgba(217,119,6,.10); border:1px solid rgba(217,119,6,.32); color:#a35a03}
  .alert-err{background:rgba(225,29,72,.10); border:1px solid rgba(225,29,72,.35); color:#b0193c}
  .alert .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0}
  .alert-ok .dot{background:var(--good)}
  .alert-warn .dot{background:var(--warn)}
  .alert-err .dot{background:var(--bad)}

  /* 初始 hero */
  .start-hero{text-align:center; padding:32px 16px}
  .start-hero .icon{
    font-size:42px; margin-bottom:6px;
    filter:drop-shadow(0 4px 12px rgba(43,124,245,.3));
  }
  .start-hero h2{
    font-size:16px; color:var(--txt); margin:0 0 6px;
    letter-spacing:.3px; justify-content:center;
  }
  .start-hero h2::before{display:none}
  .start-hero p{color:var(--sub); margin:0 0 16px; font-size:12px}

  /* ============================================================
     实时状态表格
     ============================================================ */
  .status-table{
    width:100%; border-collapse:separate; border-spacing:0;
    font-size:clamp(11.5px, 1.3vw, 13px);
    background:rgba(255,255,255,0.6);
    border:1px solid var(--glass-line);
    border-radius:10px;
    overflow:hidden;
  }
  .status-table th,
  .status-table td{
    padding:9px 10px;
    text-align:center;
    border-bottom:1px solid var(--glass-line);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .status-table th{
    background:rgba(240,245,252,0.9);
    color:var(--sub);
    font-weight:600;
    font-size:clamp(10.5px, 1.15vw, 11.5px);
    letter-spacing:.5px;
    text-transform:uppercase;
  }
  .status-table tr:last-child td{border-bottom:none}

  .status-table .tag-new{
    color:var(--accent);
    font-weight:700;
    font-size:clamp(11px, 1.2vw, 12px);
  }
  .status-table .tag-pred{
    color:var(--bad);
    font-weight:700;
    font-size:clamp(11px, 1.2vw, 12px);
  }
  .status-table .val-num{
    color:var(--txt);
    font-weight:700;
  }
  .status-table .val-combo{
    font-weight:700;
    color:var(--purple);
  }
  .status-table .val-pred-combo{
    font-weight:700;
    color:var(--bad);
    letter-spacing:.3px;
  }
  .status-table .val-pred-buy{
    color:var(--good);
    font-weight:600;
    font-size:clamp(10.5px, 1.15vw, 12px);
  }
  @media(max-width:560px){
    .status-table th:nth-child(2),
    .status-table td:nth-child(2){
      /* 开奖时间在窄屏仍然保留，但缩短内边距 */
      padding:8px 6px;
    }
  }

  /* 倒计时 & 买入行 */
  .status-foot{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:8px;
    margin-top:8px; padding-top:8px;
    border-top:1px dashed var(--glass-line);
    font-size:clamp(11px, 1.2vw, 12px);
    color:var(--sub);
  }
  .status-foot .buy-line{
    color:var(--good); font-weight:700;
    letter-spacing:.3px;
  }
  .status-foot .buy-line .label{
    color:var(--sub); font-weight:600; margin-right:4px;
  }
  .countdown{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:clamp(14px, 1.6vw, 16px);
    font-weight:800; color:var(--accent-3);
    min-width:34px; display:inline-block; text-align:right;
  }

  /* ============================================================
     KPI
     ============================================================ */
  .kpi{
    position:relative;
    background:rgba(255,255,255,0.75);
    border:1px solid var(--glass-line);
    border-radius:10px;
    padding:9px 11px;
    overflow:hidden;
  }
  .kpi .v{
    font-size:clamp(15px, 1.8vw, 18px);
    font-weight:800; line-height:1.15;
    font-variant-numeric:tabular-nums;
    letter-spacing:.2px;
  }
  .kpi .k{
    font-size:clamp(10.5px, 1.15vw, 11.5px);
    color:var(--sub); margin-top:2px; letter-spacing:.2px;
  }
  .kpi .v.good{color:var(--good)}
  .kpi .v.bad{color:var(--bad)}
  .kpi .v.warn{color:var(--warn)}
  .kpi .v.purple{color:var(--purple)}
  .kpi .v.accent{color:var(--accent)}

  /* ============================================================
     预测明细表 —— 小字体，对齐，不溢出
     ============================================================ */
  .scroll{
    width:100%;
    overflow-x:auto;
    overflow-y:auto;
    max-height:340px;
    border:1px solid var(--glass-line);
    border-radius:10px;
    background:rgba(255,255,255,0.6);
  }
  .scroll::-webkit-scrollbar{width:7px; height:7px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(100,130,180,.35); border-radius:4px}
  .scroll::-webkit-scrollbar-thumb:hover{background:rgba(100,130,180,.5)}

  .detail-table{
    width:100%;
    border-collapse:collapse;
    font-size:clamp(10.5px, 1.1vw, 11.5px);
    font-variant-numeric:tabular-nums;
    table-layout:auto;
  }
  .detail-table thead th{
    position:sticky; top:0; z-index:2;
    padding:7px 8px;
    background:rgba(240,245,252,0.97);
    color:var(--sub);
    font-weight:700;
    font-size:clamp(9.5px, 1.02vw, 10.5px);
    letter-spacing:.5px;
    text-transform:uppercase;
    text-align:center;
    border-bottom:1px solid var(--glass-line);
    white-space:nowrap;
  }
  .detail-table tbody td{
    padding:6px 8px;
    text-align:center;
    border-bottom:1px solid rgba(150,170,200,0.15);
    white-space:nowrap;
    color:var(--txt-2);
    font-weight:500;
  }
  .detail-table tbody tr:last-child td{border-bottom:none}
  .detail-table tbody tr:hover td{background:rgba(43,124,245,.05)}
  .detail-table .c-nbr{font-weight:700; color:var(--txt)}
  .detail-table .c-time{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:0.95em; color:var(--sub)}
  .detail-table .c-num{font-weight:700; color:var(--txt)}
  .detail-table .c-combo{font-weight:700; color:var(--purple)}
  .detail-table .c-excl{font-weight:700; color:var(--warn)}
  .detail-table .c-hit{font-weight:800; color:var(--good)}
  .detail-table .c-miss{font-weight:800; color:var(--bad)}

  /* ============================================================
     底部信息条
     ============================================================ */
  .bottom-info{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:8px;
    margin-top:10px;
    font-size:11.5px; color:var(--sub);
  }

  /* ============================================================
     隐藏区块(按要求不显示)
     ============================================================ */
  #chartsArea, #weightsCard{display:none !important}
</style>
</head>
<body>

<div class="grid-overlay"></div>

<div class="wrap">

  <!-- Hero -->
  <div class="hero">
    <div>
      <h1>PC28 · 四组合排除法实时预测</h1>
      <div class="sub">本地记忆库 · 四策略动态加权 · 每 30 秒自动同步开奖</div>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
      <div class="mem-badge"><span class="mem-dot"></span><span id="memBadge">本地记忆 0 期</span></div>
      <div class="live-badge"><span class="live-dot"></span>LIVE</div>
    </div>
  </div>

  <div id="alertBox" class="alert alert-warn">
    <span class="dot"></span>
    <span id="alertMsg">正在初始化…</span>
  </div>

  <div class="card start-hero" id="startHero">
    <div class="icon">📡</div>
    <h2>正在唤醒记忆库</h2>

  <!-- 实时状态 -->
  <div class="card" id="statusCard" style="display:none">

      <span class="pill" id="lastUpdate" style="display:inline-flex; padding:3px 10px; border-radius:14px; font-size:11px; background:rgba(240,245,252,.9); border:1px solid var(--glass-line); color:var(--sub)">—</span>
      <span class="pill" id="dataCount" style="display:inline-flex; padding:3px 10px; border-radius:14px; font-size:11px; background:rgba(240,245,252,.9); border:1px solid var(--glass-line); color:var(--sub)">0 期</span>
    </div>
  </div>

  <!-- 隐藏的图表容器(保留 DOM，方便日后恢复) -->
  <div id="chartsArea">
    <div class="grid" style="grid-template-columns:1fr 1fr; gap:14px">
      <div class="card">
        <h2>滚动 30 期命中率</h2>
        <div class="chart-box" style="position:relative;height:290px"><canvas id="chartRoll"></canvas></div>
      </div>
      <div class="card">
        <h2>累计命中率</h2>
        <div class="chart-box" style="position:relative;height:290px"><canvas id="chartCum"></canvas></div>
      </div>
    </div>
  </div>

  <!-- KPI -->
  <div class="card" id="statsCard" style="display:none">
    <h2>统计面板</h2>
    <div class="grid g4" id="kpis"></div>
  </div>

  <!-- 隐藏的策略权重容器 -->
  <div class="card" id="weightsCard" style="display:none">
    <h2>策略权重</h2>
    <div class="strategy-bars" id="strategyBars"></div>
  </div>

  <!-- 预测明细 -->
  <div class="card" id="detailCard" style="display:none">
    <h2>预测明细 · 最近 40 期</h2>
    <div class="scroll">
      <table class="detail-table" id="detailTable">
        <thead>
          <tr>
            <th>期号</th>
            <th>开奖时间</th>
            <th>开奖号码</th>
            <th>和值</th>
            <th>组合</th>
            <th>排除组合</th>
            <th>结果</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- 底部 -->
  <div class="bottom-info">
    <div id="footerInfo">本地记忆 0 期</div>
  </div>

</div>

<script>
// ================================================================
// 常量
// ================================================================
const API_URL = 'https://pc28.help/api/kj.json?nbr=80';
const POLL_INTERVAL = 30;
const MAX_RETRY = 3;
const RETRY_DELAY = 5000;
const MIN_DATA = 50;
const TRAIN_MIN = 50;
const EVAL_WIN = 30;
const STRATEGY_WIN = 30;
const REFIT_INTERVAL = 50;
const MARKOV_INTERVAL = 100;

const IDB_NAME = 'pc28_memory_db';
const IDB_STORE = 'history';
const IDB_VERSION = 1;
const IDB_MAX = 10000;
const LS_KEY = 'pc28_memory';
const LS_MAX = 5000;

const COMBOS = {
  '大单': [15,17,19,21,23,25,27],
  '大双': [14,16,18,20,22,24,26],
  '小单': [1,3,5,7,9,11,13],
  '小双': [0,2,4,6,8,10,12]
};
const NAMES = ['大单', '大双', '小单', '小双'];
const STRAT_NAMES = ['A · AR 和值', 'B · 一阶马尔可夫', 'C · 20 期频率', 'D · 随机基线'];
const STRAT_COLORS = ['#2b7cf5', '#10a37f', '#d97706', '#7f93ab'];

function valToCombo(v){
  for(const n of NAMES) if(COMBOS[n].includes(v)) return n;
  return null;
}
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));

// ================================================================
// 数学工具
// ================================================================
function normCdf(z){
  const t = 1/(1 + 0.2316419 * Math.abs(z));
  const d = 0.3989423 * Math.exp(-z*z/2);
  const p = d*t*(0.3193815 + t*(-0.3565638 + t*(1.781478 + t*(-1.821256 + t*1.330274))));
  return z > 0 ? 1 - p : p;
}
function normProbRange(mu, sigma, a, b){
  if(sigma <= 0) return 0;
  return normCdf((b - mu)/sigma) - normCdf((a - mu)/sigma);
}
function comboProb(comboName, mu, sigma){
  let p = 0;
  for(const v of COMBOS[comboName]) p += normProbRange(mu, sigma, v - 0.5, v + 0.5);
  return p;
}
function comboProbabilities(mu, sigma){
  const probs = {};
  for(const c of NAMES) probs[c] = comboProb(c, mu, sigma);
  const s = NAMES.reduce((a,c) => a + probs[c], 0) || 1;
  for(const c of NAMES) probs[c] /= s;
  let excluded = NAMES[0], lo = Infinity;
  for(const c of NAMES) if(probs[c] < lo){ lo = probs[c]; excluded = c; }
  return { probs, excluded };
}
function solveLinear(A, b){
  const n = A.length;
  const M = A.map((row, i) => row.concat([b[i]]));
  for(let i = 0; i < n; i++){
    let pivot = i;
    for(let r = i + 1; r < n; r++) if(Math.abs(M[r][i]) > Math.abs(M[pivot][i])) pivot = r;
    if(Math.abs(M[pivot][i]) < 1e-12) return null;
    if(pivot !== i){ const tmp = M[i]; M[i] = M[pivot]; M[pivot] = tmp; }
    for(let r = i + 1; r < n; r++){
      const f = M[r][i] / M[i][i];
      for(let c = i; c <= n; c++) M[r][c] -= f * M[i][c];
    }
  }
  const x = new Array(n).fill(0);
  for(let i = n - 1; i >= 0; i--){
    let s = M[i][n];
    for(let j = i + 1; j < n; j++) s -= M[i][j] * x[j];
    x[i] = s / M[i][i];
  }
  return x;
}
function olsSolve(X, y){
  const n = X.length, p = X[0].length;
  const XtX = Array.from({length: p}, () => new Array(p).fill(0));
  const Xty = new Array(p).fill(0);
  for(let i = 0; i < n; i++){
    for(let a = 0; a < p; a++){
      Xty[a] += X[i][a] * y[i];
      for(let b = 0; b < p; b++) XtX[a][b] += X[i][a] * X[i][b];
    }
  }
  return solveLinear(XtX, Xty);
}
function movingAverage(arr, end, win){
  const start = Math.max(0, end - win);
  if(end === start) return arr[end];
  let s = 0;
  for(let i = start; i < end; i++) s += arr[i];
  return s / (end - start);
}
function computeResiduals(arr, start, end, win){
  const r = [];
  for(let t = start; t < end; t++){
    const ma = movingAverage(arr, t, win);
    r.push(arr[t] - ma);
  }
  return r;
}
function aicBic(residuals, p){
  const n = residuals.length;
  if(n < p + 5) return { aic: Infinity, bic: Infinity };
  const X = [], y = [];
  for(let t = p; t < n; t++){
    const row = [1];
    for(let j = 1; j <= p; j++) row.push(residuals[t-j]);
    X.push(row); y.push(residuals[t]);
  }
  const beta = olsSolve(X, y);
  if(!beta) return { aic: Infinity, bic: Infinity };
  let sse = 0;
  for(let i = 0; i < X.length; i++){
    let pred = 0;
    for(let j = 0; j < beta.length; j++) pred += beta[j] * X[i][j];
    sse += (y[i] - pred) ** 2;
  }
  if(sse <= 1e-12) return { aic: Infinity, bic: Infinity };
  const m = X.length, k = p + 1;
  return {
    aic: m * Math.log(sse / m) + 2 * k,
    bic: m * Math.log(sse / m) + Math.log(m) * k
  };
}
function fitAR(residuals, p){
  const n = residuals.length;
  if(n < p + 5) return null;
  const X = [], y = [];
  for(let t = p; t < n; t++){
    const row = [1];
    for(let j = 1; j <= p; j++) row.push(residuals[t-j]);
    X.push(row); y.push(residuals[t]);
  }
  const beta = olsSolve(X, y);
  if(!beta) return null;
  let sse = 0;
  for(let i = 0; i < X.length; i++){
    let pred = 0;
    for(let j = 0; j < beta.length; j++) pred += beta[j] * X[i][j];
    sse += (y[i] - pred) ** 2;
  }
  const dof = Math.max(1, X.length - beta.length);
  return { coef: beta, sigma: Math.sqrt(sse / dof), n: X.length, p };
}
function selectBestP(residuals, maxP){
  let best = { p: 1, score: Infinity };
  for(let p = 1; p <= maxP; p++){
    const { aic } = aicBic(residuals, p);
    if(aic < best.score) best = { p, score: aic };
  }
  return best.p;
}
function forecastAR(arModel, recentResiduals){
  if(!arModel) return 0;
  const { coef, p } = arModel;
  let pred = coef[0];
  for(let j = 1; j <= p; j++){
    const r = recentResiduals[recentResiduals.length - j];
    pred += coef[j] * (Number.isFinite(r) ? r : 0);
  }
  return pred;
}
function optimizeWindow(values, t, minW, maxW, evalLen){
  if(t < 30) return Math.min(20, minW);
  const evalStart = Math.max(10, t - evalLen);
  const evalEnd = t;
  if(evalEnd - evalStart < 20) return 10;
  let bestW = minW, bestRmse = Infinity;
  for(let W = minW; W <= maxW; W += 5){
    let sse = 0, cnt = 0;
    for(let s = evalStart; s < evalEnd; s++){
      const ma = movingAverage(values, s, W);
      sse += (values[s] - ma) ** 2;
      cnt++;
    }
    if(cnt === 0) continue;
    const rmse = Math.sqrt(sse / cnt);
    if(rmse < bestRmse){ bestRmse = rmse; bestW = W; }
  }
  return bestW;
}
function buildMarkov1(comboSeq, start, end){
  const table = new Map();
  for(const a of NAMES) table.set(a, { total: 0, counts: Object.fromEntries(NAMES.map(n=>[n,0])) });
  for(let i = Math.max(1, start); i < end; i++){
    const a = comboSeq[i-1], c = comboSeq[i];
    if(!a || !c) continue;
    const rec = table.get(a);
    if(rec){ rec.total++; rec.counts[c]++; }
  }
  return table;
}
function markovPredict(table, prev, alpha, minSamples){
  const rec = table.get(prev);
  if(!rec || rec.total < minSamples) return null;
  const probs = {};
  let denom = 0;
  for(const c of NAMES){
    probs[c] = rec.counts[c] + alpha;
    denom += probs[c];
  }
  for(const c of NAMES) probs[c] /= denom;
  let excluded = NAMES[0], lo = Infinity;
  for(const c of NAMES) if(probs[c] < lo){ lo = probs[c]; excluded = c; }
  return { probs, excluded };
}
function freqPredict(comboSeq, t, win){
  const start = Math.max(0, t - win);
  const counts = Object.fromEntries(NAMES.map(n=>[n,0]));
  for(let i = start; i < t; i++){
    const c = comboSeq[i];
    if(c) counts[c]++;
  }
  const total = Math.max(1, t - start);
  const probs = {};
  for(const c of NAMES) probs[c] = counts[c] / total;
  let excluded = NAMES[0], lo = Infinity;
  for(const c of NAMES) if(probs[c] < lo){ lo = probs[c]; excluded = c; }
  return { probs, excluded };
}
let rngState = 987654321;
function rng(){
  rngState = (rngState * 1103515245 + 12345) & 0x7fffffff;
  return rngState / 0x7fffffff;
}
function randomPredict(){
  const probs = Object.fromEntries(NAMES.map(n=>[n,0.25]));
  const excluded = NAMES[Math.floor(rng() * 4)];
  return { probs, excluded };
}
function softmax(scores, T){
  const maxS = Math.max(...scores);
  const exps = scores.map(s => Math.exp((s - maxS) / T));
  const sum = exps.reduce((a,b) => a + b, 0) || 1;
  return exps.map(e => e / sum);
}

const Memory = (() => {
  let idb = null;
  let useIDB = false;

  async function openIDB(){
    if(!('indexedDB' in window)) throw new Error('IndexedDB 不可用');
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains(IDB_STORE)){
          const store = db.createObjectStore(IDB_STORE, { keyPath: 'nbr' });
          store.createIndex('nbr_num', 'nbr', { unique: true });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e.target.error);
      req.onblocked = () => reject(new Error('IndexedDB blocked'));
    });
  }
  async function init(){
    try{
      idb = await openIDB();
      useIDB = true;
      console.log('[Memory] IndexedDB 已就绪');
    } catch(e){
      console.warn('[Memory] IndexedDB 不可用，改用 localStorage 兜底:', e);
      idb = null;
      useIDB = false;
    }
  }
  async function getAll(){
    if(useIDB){
      return new Promise((resolve, reject) => {
        try{
          const tx = idb.transaction(IDB_STORE, 'readonly');
          const store = tx.objectStore(IDB_STORE);
          const req = store.getAll();
          req.onsuccess = () => {
            const arr = req.result || [];
            arr.sort((a,b) => parseInt(a.nbr) - parseInt(b.nbr));
            resolve(arr);
          };
          req.onerror = (e) => reject(e.target.error);
        } catch(e){ reject(e); }
      });
    }
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(!raw) return [];
      const arr = JSON.parse(raw);
      if(!Array.isArray(arr)) return [];
      const valid = arr.filter(r =>
        r && typeof r.nbr === 'string' && r.nbr.length > 0 &&
        Number.isFinite(r.num) && r.num >= 0 && r.num <= 27 &&
        NAMES.includes(r.combination)
      );
      valid.sort((a,b) => parseInt(a.nbr) - parseInt(b.nbr));
      return valid;
    } catch(e){
      console.warn('[Memory] localStorage 读取失败:', e);
      return [];
    }
  }
  async function putMany(records){
    if(!records.length) return 0;
    if(useIDB){
      return new Promise((resolve, reject) => {
        try{
          const tx = idb.transaction(IDB_STORE, 'readwrite');
          const store = tx.objectStore(IDB_STORE);
          for(const r of records){
            store.put(r);
          }
          tx.oncomplete = () => resolve(records.length);
          tx.onerror = (e) => reject(e.target.error);
        } catch(e){ reject(e); }
      });
    }
    try{
      const cur = await getAll();
      const map = new Map(cur.map(r => [r.nbr, r]));
      for(const r of records) map.set(r.nbr, r);
      let arr = Array.from(map.values()).sort((a,b) => parseInt(a.nbr) - parseInt(b.nbr));
      if(arr.length > LS_MAX) arr = arr.slice(-LS_MAX);
      localStorage.setItem(LS_KEY, JSON.stringify(arr));
      return records.length;
    } catch(e){
      console.warn('[Memory] localStorage 写入失败:', e);
      return 0;
    }
  }
  async function trimToMax(max){
    if(useIDB){
      return new Promise((resolve) => {
        try{
          const tx = idb.transaction(IDB_STORE, 'readwrite');
          const store = tx.objectStore(IDB_STORE);
          const countReq = store.count();
          countReq.onsuccess = () => {
            const cnt = countReq.result;
            if(cnt <= max){ resolve(0); return; }
            const toDelete = cnt - max;
            const curReq = store.openCursor();
            let deleted = 0;
            curReq.onsuccess = (e) => {
              const cur = e.target.result;
              if(cur && deleted < toDelete){
                cur.delete(); deleted++; cur.continue();
              } else {
                resolve(deleted);
              }
            };
            curReq.onerror = () => resolve(0);
          };
          countReq.onerror = () => resolve(0);
        } catch(e){ resolve(0); }
      });
    }
    try{
      const arr = await getAll();
      if(arr.length > max){
        const trimmed = arr.slice(-max);
        localStorage.setItem(LS_KEY, JSON.stringify(trimmed));
        return arr.length - trimmed.length;
      }
      return 0;
    } catch(e){ return 0; }
  }
  async function clearAll(){
    if(useIDB){
      return new Promise((resolve) => {
        try{
          const tx = idb.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).clear();
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        } catch(e){ resolve(false); }
      });
    }
    try{
      localStorage.removeItem(LS_KEY);
      return true;
    } catch(e){ return false; }
  }
  return { init, getAll, putMany, trimToMax, clearAll, isIDB: () => useIDB };
})();

async function fetchDataWithRetry(){
  for(let attempt = 1; attempt <= MAX_RETRY; attempt++){
    try{
      const res = await fetch(API_URL + '&_t=' + Date.now(), { cache: 'no-store' });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if(json.message !== 'success' || !Array.isArray(json.data)){
        throw new Error('返回格式异常');
      }
      return json.data;
    } catch(err){
      console.warn(`[fetch] 第 ${attempt} 次失败:`, err.message);
      if(attempt < MAX_RETRY) await new Promise(r => setTimeout(r, RETRY_DELAY));
      else throw err;
    }
  }
}
function parseRecord(item){
  if(!item || typeof item !== 'object') return null;
  const nbr = String(item.nbr || '').trim();
  if(!nbr) return null;
  const num = parseInt(item.num, 10);
  if(!Number.isFinite(num) || num < 0 || num > 27) return null;
  let combo = (item.combination || '').trim();
  if(!NAMES.includes(combo)) combo = valToCombo(num);
  if(!combo) return null;
  return {
    nbr, num, combination: combo,
    number: item.number || '',
    date: item.date || '',
    time: item.time || ''
  };
}
function mergeIntoState(incomingItems){
  const map = new Map(state.rawData.map(r => [r.nbr, r]));
  const toPersist = [];
  let added = 0;
  for(const item of incomingItems){
    const rec = parseRecord(item);
    if(!rec) continue;
    if(!map.has(rec.nbr)){
      map.set(rec.nbr, rec);
      toPersist.push(rec);
      added++;
    } else {
      const cur = map.get(rec.nbr);
      let changed = false;
      if(!cur.number && rec.number){ cur.number = rec.number; changed = true; }
      if(!cur.date && rec.date){ cur.date = rec.date; changed = true; }
      if(!cur.time && rec.time){ cur.time = rec.time; changed = true; }
      if(changed) toPersist.push(cur);
    }
  }
  const merged = Array.from(map.values()).sort(
    (a,b) => parseInt(a.nbr) - parseInt(b.nbr)
  );
  return { merged, toPersist, added };
}
function applyMerged(merged){
  state.rawData = merged;
  state.values = merged.map(r => r.num);
  state.comboSeq = merged.map(r => r.combination);
}

// ================================================================
// 预测引擎(完全不变)
// ================================================================
function refitAR(t){
  const trainStart = Math.max(0, t - 1000);
  const trainEnd = t;
  if(trainEnd - trainStart < 30) return null;
  const residuals = computeResiduals(state.values, trainStart, trainEnd, state.currentW);
  const dataLen = state.values.length;
  const maxP = Math.max(1, Math.min(Math.floor(dataLen / 10), 10));
  const bestP = selectBestP(residuals, maxP);
  return fitAR(residuals, bestP);
}
function runBacktestIncremental(){
  const values = state.values;
  const comboSeq = state.comboSeq;
  const n = values.length;
  if(n < MIN_DATA) return;
  const startT = Math.max(TRAIN_MIN, state.records.length + TRAIN_MIN);
  if(!state.currentAR){
    state.currentW = optimizeWindow(values, Math.min(TRAIN_MIN, n), 5, 50, Math.min(100, n));
    state.currentAR = refitAR(TRAIN_MIN);
    state.currentSigma = state.currentAR ? state.currentAR.sigma : 3.0;
  }
  for(let t = startT; t < n; t++){
    const stepsDone = t - TRAIN_MIN;
    if(stepsDone > 0 && stepsDone % REFIT_INTERVAL === 0){
      state.currentW = optimizeWindow(values, t, 5, 50, Math.min(100, t));
      state.currentAR = refitAR(t);
      state.currentSigma = state.currentAR ? state.currentAR.sigma : 3.0;
    }
    if(state.markovTable === null || (stepsDone > 0 && stepsDone % MARKOV_INTERVAL === 0)){
      const mStart = Math.max(0, t - 1000);
      state.markovTable = buildMarkov1(comboSeq, mStart, t);
      state.markovBuiltAt = t;
    }
    let stratA = null;
    if(state.currentAR){
      const p = state.currentAR.p;
      const recent = [];
      for(let j = 0; j < p; j++){
        const idx = t - 1 - j;
        if(idx < 0){ recent.push(0); continue; }
        const ma = movingAverage(values, idx, state.currentW);
        recent.push(values[idx] - ma);
      }
      const rPred = forecastAR(state.currentAR, recent);
      const ma = movingAverage(values, t, state.currentW);
      const mu = clamp(ma + rPred, 0, 27);
      const sigma = Math.max(state.currentSigma, 1.5);
      const { probs, excluded } = comboProbabilities(mu, sigma);
      stratA = { excluded, probs, mu, sigma };
    }
    let stratB = null;
    if(state.markovTable && t >= 1){
      const prev = comboSeq[t-1];
      if(prev){
        const r = markovPredict(state.markovTable, prev, 1.0, 3);
        if(r) stratB = { excluded: r.excluded, probs: r.probs };
      }
    }
    const stratC = freqPredict(comboSeq, t, 20);
    const stratD = randomPredict();
    const actual = comboSeq[t];
    const hitA = stratA && stratA.excluded !== actual ? 1 : 0;
    const hitB = stratB && stratB.excluded !== actual ? 1 : 0;
    const hitC = stratC.excluded !== actual ? 1 : 0;
    const hitD = stratD.excluded !== actual ? 1 : 0;
    state.hitsByStrategy.push([hitA, hitB, hitC, hitD]);
    const winStart = Math.max(0, state.hitsByStrategy.length - STRATEGY_WIN);
    const acc = [0, 0, 0, 0];
    const cnt = state.hitsByStrategy.length - winStart;
    for(let i = winStart; i < state.hitsByStrategy.length; i++){
      for(let k = 0; k < 4; k++) acc[k] += state.hitsByStrategy[i][k];
    }
    const accRates = acc.map(a => cnt > 0 ? a / cnt : 0.25);
    const weights = softmax(accRates, 1.0);
    const vote = Object.fromEntries(NAMES.map(n => [n, 0]));
    if(stratA) vote[stratA.excluded] += weights[0];
    if(stratB) vote[stratB.excluded] += weights[1];
    vote[stratC.excluded] += weights[2];
    vote[stratD.excluded] += weights[3];
    let finalExcluded = NAMES[0], mx = -Infinity;
    for(const c of NAMES) if(vote[c] > mx){ mx = vote[c]; finalExcluded = c; }
    const hit = finalExcluded !== actual;
    state.records.push({
      t, nbr: state.rawData[t].nbr, value: values[t], actual, excluded: finalExcluded, hit,
      mu: stratA ? stratA.mu : null,
      sigma: stratA ? stratA.sigma : null,
      weights: weights.slice(),
      stratExcl: [
        stratA ? stratA.excluded : null,
        stratB ? stratB.excluded : null,
        stratC.excluded,
        stratD.excluded
      ]
    });
  }
}
function predictNext(){
  const values = state.values;
  const comboSeq = state.comboSeq;
  const n = values.length;
  if(n < MIN_DATA) return null;
  const t = n;
  let stratA = null;
  if(state.currentAR){
    const p = state.currentAR.p;
    const recent = [];
    for(let j = 0; j < p; j++){
      const idx = t - 1 - j;
      if(idx < 0){ recent.push(0); continue; }
      const ma = movingAverage(values, idx, state.currentW);
      recent.push(values[idx] - ma);
    }
    const rPred = forecastAR(state.currentAR, recent);
    const ma = movingAverage(values, t, state.currentW);
    const mu = clamp(ma + rPred, 0, 27);
    const sigma = Math.max(state.currentSigma, 1.5);
    const { probs, excluded } = comboProbabilities(mu, sigma);
    stratA = { excluded, probs, mu, sigma };
  }
  let stratB = null;
  if(state.markovTable && t >= 1){
    const prev = comboSeq[t-1];
    if(prev){
      const r = markovPredict(state.markovTable, prev, 1.0, 3);
      if(r) stratB = { excluded: r.excluded, probs: r.probs };
    }
  }
  const stratC = freqPredict(comboSeq, t, 20);
  const stratD = randomPredict();
  let weights;
  if(state.hitsByStrategy.length < 5){
    weights = [0.25, 0.25, 0.25, 0.25];
  } else {
    const winStart = Math.max(0, state.hitsByStrategy.length - STRATEGY_WIN);
    const acc = [0, 0, 0, 0];
    const cnt = state.hitsByStrategy.length - winStart;
    for(let i = winStart; i < state.hitsByStrategy.length; i++){
      for(let k = 0; k < 4; k++) acc[k] += state.hitsByStrategy[i][k];
    }
    const accRates = acc.map(a => cnt > 0 ? a / cnt : 0.25);
    weights = softmax(accRates, 1.0);
  }
  const vote = Object.fromEntries(NAMES.map(n => [n, 0]));
  if(stratA) vote[stratA.excluded] += weights[0];
  if(stratB) vote[stratB.excluded] += weights[1];
  vote[stratC.excluded] += weights[2];
  vote[stratD.excluded] += weights[3];
  let finalExcluded = NAMES[0], mx = -Infinity;
  for(const c of NAMES) if(vote[c] > mx){ mx = vote[c]; finalExcluded = c; }
  return {
    excluded: finalExcluded,
    buys: NAMES.filter(n => n !== finalExcluded),
    weights,
    mu: stratA ? stratA.mu : null,
    sigma: stratA ? stratA.sigma : null,
    stratExcl: [
      stratA ? stratA.excluded : null,
      stratB ? stratB.excluded : null,
      stratC.excluded,
      stratD.excluded
    ]
  };
}

function computeStats(){
  const hits = state.records.map(r => r.hit ? 1 : 0);
  if(!hits.length) return null;
  const totalHit = hits.reduce((a,b)=>a+b,0) / hits.length;
  const roll = [];
  for(let i = 0; i + EVAL_WIN <= hits.length; i++){
    let s = 0;
    for(let j = 0; j < EVAL_WIN; j++) s += hits[i+j];
    roll.push(s / EVAL_WIN);
  }
  let rollMean = 0, rollMin = 0, rollMax = 0, pct85 = 0, rollStd = 0;
  if(roll.length){
    rollMean = roll.reduce((a,b)=>a+b,0) / roll.length;
    const v = roll.reduce((a,b)=>a+(b-rollMean)**2,0) / roll.length;
    rollStd = Math.sqrt(v);
    rollMin = Math.min(...roll);
    rollMax = Math.max(...roll);
    pct85 = roll.filter(x => x >= 0.85).length / roll.length;
  }
  let maxMiss = 0, cur = 0;
  for(const h of hits){
    cur = h ? 0 : cur + 1;
    if(cur > maxMiss) maxMiss = cur;
  }
  return { totalHit, rollMean, rollStd, rollMin, rollMax, pct85, maxMiss, roll, hits };
}

          <td class="val-num">${last.number || '—'}</td>
          <td class="val-num">${last.num}</td>
          <td class="val-combo">${last.combination}</td>
        </tr>
        <tr>
          <td class="tag-pred">下期预测</td>
          <td>待开奖</td>
          <td class="val-num">${nextNbr}</td>
          <td>—</td>
          <td>—</td>
          <td>${predComboCell}</td>
        </tr>
      </tbody>
    </table>
  `;

  // 推荐买入行
  const buyLine = document.getElementById('buyLine');
  if(pred){
    buyLine.innerHTML = `<span class="label">推荐买入</span>${pred.buys.join(' · ')}`;
  } else {
    buyLine.innerHTML = `<span class="label">推荐买入</span>—`;
  }

  const n = state.rawData.length;
  document.getElementById('footerInfo').textContent = `本地记忆 ${n} 期`;
  document.getElementById('memBadge').textContent = `本地记忆 ${n} 期`;
}

function renderKPIs(){
  const stats = computeStats();
  if(!stats) return;
  const kpis = [
    { k: '总命中率', v: (stats.totalHit*100).toFixed(2)+'%',
      cls: stats.totalHit >= 0.85 ? 'good' : stats.totalHit >= 0.75 ? 'warn' : 'bad' },
    { k: '滚动 30 期均值', v: (stats.rollMean*100).toFixed(2)+'%',
      cls: stats.rollMean >= 0.85 ? 'good' : stats.rollMean >= 0.75 ? 'warn' : 'bad' },
    { k: '最差连续 30 期', v: (stats.rollMin*100).toFixed(2)+'%',
      cls: stats.rollMin >= 0.80 ? 'good' : stats.rollMin >= 0.70 ? 'warn' : 'bad' },
    { k: '≥85% 窗口占比', v: (stats.pct85*100).toFixed(1)+'%',
      cls: stats.pct85 >= 0.90 ? 'good' : stats.pct85 >= 0.70 ? 'warn' : 'bad' },
    { k: 'AR 阶数 p', v: state.currentAR ? state.currentAR.p : '—', cls: 'purple' },
    { k: '移动平均窗口 W', v: state.currentW, cls: 'purple' },
    { k: '残差 σ', v: state.currentSigma.toFixed(3), cls: 'accent' },
    { k: '回测期数', v: state.records.length, cls: '' }
  ];
  document.getElementById('kpis').innerHTML = kpis.map(x =>
    `<div class="kpi"><div class="v ${x.cls}">${x.v}</div><div class="k">${x.k}</div></div>`
  ).join('');
}

// 明细表：新增开奖时间、开奖号码列，字体小而对齐
function renderTable(){
  const tbody = document.querySelector('#detailTable tbody');
  const records = state.records.slice(-40).reverse();
  tbody.innerHTML = records.map(r => {
    // 从 rawData 取原始 date/time/number
    const raw = state.rawData[r.t] || {};
    const timeStr = formatTimeShort(raw.date, raw.time);
    const numberStr = raw.number || '—';
    return `
      <tr>
        <td class="c-nbr">${r.nbr}</td>
        <td class="c-time">${timeStr}</td>
        <td class="c-num">${numberStr}</td>
        <td class="c-num">${r.value}</td>
        <td class="c-combo">${r.actual}</td>
        <td class="c-excl">${r.excluded}</td>
        <td class="${r.hit ? 'c-hit' : 'c-miss'}">${r.hit ? '命中' : '未中'}</td>
      </tr>
    `;
  }).join('');
}

function renderAll(){
  if(state.rawData.length === 0) return;
  renderLatest();
  renderKPIs();
  renderTable();
}

// ================================================================
// 主流程
// ================================================================
function setAlert(msg, cls){
  const box = document.getElementById('alertBox');
  box.className = 'alert alert-' + (cls || 'warn');
  document.getElementById('alertMsg').textContent = msg;
}

async function bootstrapFromMemory(){
  const stored = await Memory.getAll();
  if(stored.length > 0){
    applyMerged(stored);
    state.bootSource = 'memory';
    console.log(`[bootstrap] 记忆库装载 ${stored.length} 期`);
    document.getElementById('footerInfo').textContent = `本地记忆 ${stored.length} 期`;
    document.getElementById('memBadge').textContent = `本地记忆 ${stored.length} 期`;
    return stored.length;
  }
  state.bootSource = 'api';
  return 0;
}

async function fetchAndUpdate(silent){
  try{
    const items = await fetchDataWithRetry();
    const { merged, toPersist, added } = mergeIntoState(items);
    if(toPersist.length){
      await Memory.putMany(toPersist);
    }
    const trimmed = await Memory.trimToMax(IDB_MAX);
    applyMerged(merged);

    document.getElementById('dataCount').textContent = state.rawData.length + ' 期';
    document.getElementById('lastUpdate').textContent = '更新于 ' + new Date().toLocaleTimeString();
    document.getElementById('footerInfo').textContent = `本地记忆 ${state.rawData.length} 期`;
    document.getElementById('memBadge').textContent = `本地记忆 ${state.rawData.length} 期`;

    if(state.rawData.length < MIN_DATA){
      setAlert(`数据不足(当前 ${state.rawData.length} 期，需要至少 ${MIN_DATA} 期)，请等待积累。`, 'warn');
      return;
    }
    runBacktestIncremental();
    state.nextPrediction = predictNext();
    renderAll();

    const engineLabel = Memory.isIDB() ? 'IndexedDB' : 'localStorage';
    if(added > 0 || !silent){
      const trimMsg = trimmed > 0 ? ` · 裁剪 ${trimmed} 期` : '';
      setAlert(`本地记忆 ${state.rawData.length} 期 · 新增 ${added} 期${trimMsg} · 引擎 ${engineLabel} · 预测已更新`, 'ok');
    } else {
      setAlert(`本地记忆 ${state.rawData.length} 期 · 无新增 · 引擎 ${engineLabel}`, 'ok');
    }
  } catch(err){
    console.error(err);
    setAlert('数据获取异常：' + err.message, 'err');
  }
}

function startCountdown(){
  if(state.countdownTimer) clearInterval(state.countdownTimer);
  state.countdown = POLL_INTERVAL;
  document.getElementById('countdown').textContent = state.countdown;
  state.countdownTimer = setInterval(() => {
    state.countdown--;
    document.getElementById('countdown').textContent = Math.max(0, state.countdown);
    if(state.countdown <= 0) state.countdown = POLL_INTERVAL;
  }, 1000);
}

function startPolling(){
  if(state.pollTimer) clearInterval(state.pollTimer);
  state.pollTimer = setInterval(() => {
    fetchAndUpdate(true);
    state.countdown = POLL_INTERVAL;
  }, POLL_INTERVAL * 1000);
}

// ================================================================
// 初始化
// ================================================================
(async function init(){
  setAlert('正在唤醒记忆库…', 'warn');
  await Memory.init();
  const localCount = await bootstrapFromMemory();
  await fetchAndUpdate(localCount > 0);
  startCountdown();
  startPolling();

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible'){
      fetchAndUpdate(true);
      state.countdown = POLL_INTERVAL;
    }
  });
  window.addEventListener('beforeunload', () => {
    if(state.rawData.length){
      try{ Memory.putMany(state.rawData); }catch(e){}
    }
  });
})();

</script>
